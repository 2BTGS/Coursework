stages:
    - validate
    - build
    - test

validate-code:
    stage: validate
    tags:
        - comp1005_2025_coursework_05_validator
    script:
        - run_validator

build-code:
    stage: build
    tags:
        - comp1005_2025_coursework_05_sandbox
    artifacts:
        name: "$CI_COMMIT_REF_NAME"
        when: on_success
        expire_in: 1 hour
        paths:
            - log/
    script:
        - run_build

test-code:
    stage: test
    tags:
        - comp1005_2025_coursework_05_assessor
    artifacts:
        name: "$CI_COMMIT_REF_NAME"
        when: on_success
        expire_in: 1 week
        paths:
            - log/
    script:
        - run_test
